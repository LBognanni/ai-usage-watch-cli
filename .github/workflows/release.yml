name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version (for example: 0.1.0 or v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Releases must run from main.' >&2
            exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable version such as 0.1.0 or v0.1.0.' >&2
            exit 1
          fi
          TAG="v${INPUT_VERSION#v}"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false

      - name: Check and test
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          sh -n install.sh
          go vet ./...
          go test -race ./...

      - name: Build Linux archives and checksums
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CGO_ENABLED: '0'
          GOOS: linux
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "dist/$arch/aiu" ./cmd/aiu
            tar -czf "dist/aiu_linux_$arch.tar.gz" -C "dist/$arch" aiu
          done
          test "$(./dist/amd64/aiu --version)" = "aiu $TAG"
          cd dist
          sha256sum aiu_linux_*.tar.gz > SHA256SUMS

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist/aiu_linux_*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "$TAG" --generate-notes --draft
          gh release edit "$TAG" --draft=false --latest
